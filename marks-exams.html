<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Management V2 — Exams & Marks</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f3f6fb;color:#172033}header{background:#003580;color:#fff;padding:18px;text-align:center}header h1{margin:0}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:150px}.field label{display:block;font-size:11px;font-weight:bold;color:#475569;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033}button{padding:9px 13px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-weight:bold;cursor:pointer}.primary{background:#003580;color:#fff}.green{background:#15803d;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #dbe3ef;text-align:left}.table th{background:#eaf1ff;color:#003580}.table input{width:90px;padding:8px;border:1px solid #cbd5e1;border-radius:6px}.muted{color:#64748b;font-size:12px}.result{font-size:16px;font-weight:bold;color:#003580}.nav{display:inline-block;margin:10px 0;text-decoration:none;color:#003580;font-weight:bold}.success{padding:10px;border-radius:9px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.examlist button{margin:3px}.selected{outline:2px solid #003580}@media(max-width:700px){.table{font-size:12px}.field{min-width:130px}}</style></head><body><header><h1>📝 Exams, Marks & Results</h1><p>Connected to School Management V2</p></header><main class="wrap"><a class="nav" href="school-management-v2.html">← Back to School Management V2</a><div class="card"><h2>1. Create / Select Exam</h2><div class="row"><div class="field"><label>Exam name</label><input id="examName" placeholder="FA 1 / Quarterly / Annual"></div><div class="field"><label>Class</label><select id="examClass" onchange="onClassChange()"></select></div><div class="field"><label>Section</label><select id="examSection" onchange="onFilterChange()"></select></div><div class="field"><label>Subject</label><select id="examSubject" onchange="onFilterChange()"></select></div><div class="field"><label>Maximum marks</label><input id="maxMarks" type="number" value="100" min="1"></div><button class="primary" onclick="createExam()">Create New Exam</button></div><div id="existing" class="examlist"></div></div><div class="card"><h2>2. Enter Marks</h2><div id="examInfo" class="muted">Select an existing exam or create a new one.</div><div id="marksArea"></div><button class="green" onclick="saveMarks()">Save Marks</button></div><div class="card"><h2>3. Result Summary</h2><div id="summary" class="muted">Saved marks will appear here.</div></div></main><script>
const KEY='schoolV2Foundation';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{classes:[],students:[],exams:[]};db.exams=Array.isArray(db.exams)?db.exams:[];let selectedExamId=null;
function activeClasses(){return (db.classes||[]).map((c,i)=>({...c,_i:i})).filter(c=>!c.archived)}
function secs(c){return (c?.sections||[]).map((s,j)=>typeof s==='string'?{name:s,archived:false,_j:j}:{...s,_j:j}).filter(s=>!s.archived)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function filters(){return{ci:+document.getElementById('examClass').value,sec:document.getElementById('examSection').value,sub:document.getElementById('examSubject').value}}
function matching(){let f=filters();return db.exams.filter(e=>e.classIndex===f.ci&&e.section===f.sec&&e.subject===f.sub)}
function loadClasses(){let a=activeClasses();document.getElementById('examClass').innerHTML=a.map(c=>`<option value="${c._i}">${esc(c.name)}</option>`).join('');onClassChange()}
function onClassChange(){let ci=+document.getElementById('examClass').value,c=db.classes[ci];document.getElementById('examSection').innerHTML=secs(c).map(s=>`<option>${esc(s.name)}</option>`).join('');document.getElementById('examSubject').innerHTML=(c?.subjects||[]).map(s=>`<option>${esc(s)}</option>`).join('');selectedExamId=null;selectLatestForFilters()}
function onFilterChange(){selectedExamId=null;selectLatestForFilters()}
function selectLatestForFilters(){let exs=matching().sort((a,b)=>b.id-a.id);renderExisting();if(exs.length)selectExam(exs[0].id);else{document.getElementById('examInfo').textContent='No saved exam for this Class / Section / Subject yet.';loadStudents();renderSummary(null)}}
function renderExisting(){let exs=matching().sort((a,b)=>b.id-a.id),el=document.getElementById('existing');if(!exs.length){el.innerHTML='<p class="muted">No previous exam for this Class / Section / Subject yet.</p>';return}el.innerHTML='<p><b>Previous exams:</b> Tap an exam to load its saved marks.</p>'+exs.map(e=>`<button class="${e.id===selectedExamId?'selected':''}" onclick="selectExam(${e.id})">${esc(e.name)} • Max ${e.maxMarks}</button>`).join('')}
function selectExam(id){let ex=db.exams.find(e=>e.id===id);if(!ex)return;selectedExamId=id;document.getElementById('examName').value=ex.name;document.getElementById('examClass').value=ex.classIndex;let c=db.classes[ex.classIndex];document.getElementById('examSection').innerHTML=secs(c).map(s=>`<option>${esc(s.name)}</option>`).join('');document.getElementById('examSection').value=ex.section;document.getElementById('examSubject').innerHTML=(c?.subjects||[]).map(s=>`<option>${esc(s)}</option>`).join('');document.getElementById('examSubject').value=ex.subject;document.getElementById('maxMarks').value=ex.maxMarks;document.getElementById('examInfo').innerHTML=`<div class="success"><b>Viewing saved exam:</b> ${esc(ex.name)} • ${esc(c?.name||'')} • ${esc(ex.section)} • ${esc(ex.subject)} • Max ${ex.maxMarks}<br>Previous marks are loaded below. You can edit them and save again.</div>`;loadStudents();renderSummary(ex);renderExisting()}
function loadStudents(){let ci=+document.getElementById('examClass').value,sec=document.getElementById('examSection').value,sub=document.getElementById('examSubject').value,ex=selectedExamId?db.exams.find(e=>e.id===selectedExamId):null;if(ex&&(ex.classIndex!==ci||ex.section!==sec||ex.subject!==sub))ex=null;let list=(db.students||[]).filter(s=>!s.archived&&s.classIndex===ci&&s.section===sec);document.getElementById('marksArea').innerHTML=list.length?`<table class="table"><tr><th>Student</th><th>Marks</th></tr>${list.map(s=>{let v=ex?.marks?.[s.id];return `<tr><td>${esc(s.name)}</td><td><input type="number" min="0" max="${+document.getElementById('maxMarks').value||100}" value="${v??''}" data-student="${s.id}"></td></tr>`}).join('')}</table>`:'<p class="muted">No active students in this class/section.</p>'}
function createExam(){let f=filters(),name=document.getElementById('examName').value.trim(),max=+document.getElementById('maxMarks').value||100;if(!name)return alert('Enter exam name');let duplicate=db.exams.find(e=>e.name.toLowerCase()===name.toLowerCase()&&e.classIndex===f.ci&&e.section===f.sec&&e.subject===f.sub);if(duplicate){selectExam(duplicate.id);return alert('This exam already exists. Its saved marks have been loaded.');}let ex={id:Date.now(),name,classIndex:f.ci,section:f.sec,subject:f.sub,maxMarks:max,marks:{}};db.exams.push(ex);selectedExamId=ex.id;saveDB();selectExam(ex.id)}
function saveMarks(){let ex=selectedExamId?db.exams.find(e=>e.id===selectedExamId):null;if(!ex)return alert('Please select an existing exam or create a new exam first.');ex.marks=ex.marks||{};document.querySelectorAll('[data-student]').forEach(x=>{let v=x.value.trim();if(v==='')delete ex.marks[x.dataset.student];else ex.marks[x.dataset.student]=Math.max(0,Math.min(ex.maxMarks,+v))});saveDB();renderSummary(ex);renderExisting();alert('Marks saved successfully. They will appear again when you reopen this exam.')}
function renderSummary(ex){if(!ex){document.getElementById('summary').textContent='Select an exam to see saved results.';return}let students=(db.students||[]).filter(s=>!s.archived&&s.classIndex===ex.classIndex&&s.section===ex.section),rows=students.map(s=>{let m=ex.marks?.[s.id],p=m==null?null:m/ex.maxMarks*100,g=p==null?'—':p>=90?'A+':p>=80?'A':p>=70?'B+':p>=60?'B':p>=50?'C':p>=40?'D':'F';return{s,m,p,g}});document.getElementById('summary').innerHTML=rows.length?`<table class="table"><tr><th>Student</th><th>Marks</th><th>Percentage</th><th>Grade</th></tr>${rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${r.m==null?'—':r.m+'/'+ex.maxMarks}</td><td>${r.p==null?'—':r.p.toFixed(1)+'%'}</td><td><b class="result">${r.g}</b></td></tr>`).join('')}</table>`:'No students.'}
loadClasses();
</script></body></html>
