<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Report Cards</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#eef3f9;color:#172033}.top{background:#003580;color:#fff;padding:18px;text-align:center}.top h1{margin:0;font-size:26px}.top p{margin:7px 0 0}.wrap{max-width:1050px;margin:auto;padding:16px}.card,.report{background:#fff;border:1px solid #d8e1ec;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:180px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#172033;font-size:15px}button{padding:11px 15px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#003580;color:#fff}.green{background:#15803d;color:#fff}.nav{display:inline-block;margin:2px 0 14px;color:#003580;font-weight:bold;text-decoration:none}.muted{color:#64748b}.success{padding:12px;border-radius:10px;background:#effaf3;color:#166534;border:1px solid #ccebd7}.report{border:2px solid #003580;border-radius:18px;padding:28px;box-shadow:none}.schoolhead{text-align:center;border-bottom:3px solid #003580;padding-bottom:15px;margin-bottom:18px}.schoolname{font-size:27px;font-weight:800;color:#003580;margin:0}.schoolyear{font-size:14px;color:#475569;margin:6px 0}.ribbon{display:inline-block;background:#003580;color:#fff;padding:8px 22px;border-radius:20px;font-size:16px;font-weight:800;letter-spacing:.5px}.studentbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f6f9fd;border:1px solid #dbe5f0;border-radius:12px;padding:14px;margin-bottom:20px}.studentbox div{padding:5px}.section-title{color:#003580;margin:16px 0 9px;font-size:17px}.table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid #cbd5e1;border-radius:10px}.table th,.table td{padding:10px;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;text-align:left}.table th:last-child,.table td:last-child{border-right:0}.table tr:last-child th,.table tr:last-child td{border-bottom:0}.table th{background:#eaf1ff;color:#003580}.table .overall th{background:#dfeeff;font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.stat{border:1px solid #dbe3ef;border-radius:11px;padding:11px;text-align:center;background:#fbfdff}.stat span{display:block;color:#64748b;font-size:12px}.stat b{display:block;font-size:20px;color:#003580;margin-top:4px}.result-pass{color:#15803d!important}.teacher-note{margin-top:18px;padding:12px 14px;border-left:4px solid #003580;background:#f6f9fd;border-radius:8px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:55px}.sig{text-align:center;border-top:1px solid #64748b;padding-top:8px}.foot{text-align:center;color:#64748b;font-size:11px;margin-top:20px}@media(max-width:700px){.report{padding:16px}.studentbox{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.table{font-size:12px}.table th,.table td{padding:8px}.schoolname{font-size:22px}.signatures{margin-top:40px}}@media print{@page{size:A4 portrait;margin:10mm}html,body{width:210mm;min-height:297mm;background:#fff}body{font-size:14px}.top,.no-print{display:none!important}.wrap{width:190mm;max-width:190mm;margin:0 auto;padding:0}.report{display:block;width:190mm;height:277mm;min-height:277mm;margin:0;padding:16mm;border:2px solid #003580;border-radius:0;box-shadow:none;overflow:hidden}.schoolhead{padding-bottom:12mm;margin-bottom:10mm}.schoolname{font-size:25px}.ribbon{padding:7px 20px}.studentbox{background:#f6f9fd}.table th,.table td{padding:8px}.summary{margin-top:12mm}.teacher-note{margin-top:10mm}.signatures{margin-top:38mm}.foot{margin-top:10mm}.table th{background:#eaf1ff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.summary .stat{background:#fbfdff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.studentbox{background:#f6f9fd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ribbon{background:#003580!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header class="top"><h1>📄 Student Report Cards</h1><p>School Management V2 • Academic Performance</p></header>
<main class="wrap">
<a class="nav no-print" href="school-management-v2.html">← Back to School Management V2</a>
<div class="card no-print"><h2>Select Student</h2><div class="row"><div class="field"><label>Class</label><select id="cls" onchange="loadSections()"></select></div><div class="field"><label>Section</label><select id="sec" onchange="loadStudents()"></select></div><div class="field"><label>Student</label><select id="stu" onchange="render()"></select></div><button class="primary" onclick="render()">View Report</button><button class="green" onclick="window.print()">🖨 Print / Save PDF</button></div><p id="status" class="muted"></p></div>
<div id="report" class="report"><p class="muted">Select a student to generate the report card.</p></div>
</main>
<script>
const KEY='schoolV2Foundation';
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
let db=read();
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(){db=read();db.classes=Array.isArray(db.classes)?db.classes:[];db.students=Array.isArray(db.students)?db.students:[];db.exams=Array.isArray(db.exams)?db.exams:[]}
function activeClasses(){return db.classes.map((c,i)=>({...c,_i:i})).filter(c=>!c.archived)}
function sections(c){return(c?.sections||[]).map((s,j)=>typeof s==='string'?{name:s,archived:false,_j:j}:{...s,_j:j}).filter(s=>!s.archived)}
function loadClasses(){normalize();let a=activeClasses();document.getElementById('cls').innerHTML=a.length?a.map(c=>`<option value="${c._i}">${esc(c.name)}</option>`).join(''):'<option value="">No classes found</option>';loadSections()}
function loadSections(){normalize();let ci=Number(document.getElementById('cls').value),c=db.classes[ci];document.getElementById('sec').innerHTML=sections(c).map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');loadStudents()}
function loadStudents(){normalize();let ci=Number(document.getElementById('cls').value),sec=document.getElementById('sec').value,list=db.students.filter(s=>!s.archived&&Number(s.classIndex)===ci&&String(s.section)===String(sec));document.getElementById('stu').innerHTML=list.length?list.map(s=>`<option value="${esc(String(s.id))}">${esc(s.name)}</option>`).join(''):'<option value="">No students found</option>';document.getElementById('status').textContent=list.length?list.length+' student(s) found.':'No students found for this class/section.';render()}
function grade(p){return p==null?'—':p>=90?'A+':p>=80?'A':p>=70?'B+':p>=60?'B':p>=50?'C':p>=40?'D':'F'}
function render(){normalize();let id=String(document.getElementById('stu').value||''),s=db.students.find(x=>String(x.id)===id);if(!s){document.getElementById('report').innerHTML='<p class="muted">No student selected.</p>';return}let c=db.classes[Number(s.classIndex)],exs=db.exams.filter(e=>Number(e.classIndex)===Number(s.classIndex)&&String(e.section)===String(s.section)&&e.marks&&Object.keys(e.marks).some(k=>String(k)===id));let rows=exs.map(e=>{let key=Object.keys(e.marks).find(k=>String(k)===id),m=Number(e.marks[key]),p=Number(e.maxMarks)>0?m/Number(e.maxMarks)*100:null;return{e,m,p}});let total=rows.reduce((a,r)=>a+r.m,0),max=rows.reduce((a,r)=>a+Number(r.e.maxMarks||0),0),overall=max?total/max*100:null;document.getElementById('report').innerHTML=`<div class="schoolhead"><div class="schoolname">${esc(db.school||'My School')}</div><div class="schoolyear">Academic Year ${esc(db.year||'2026–27')}</div><div class="ribbon">STUDENT REPORT CARD</div></div><div class="studentbox"><div><b>Student:</b> ${esc(s.name)}</div><div><b>Class:</b> ${esc(c?.name||'')}</div><div><b>Section:</b> ${esc(s.section)}</div><div><b>Admission No:</b> ${esc(s.admissionNo||'—')}</div></div><h3 class="section-title">Examination Performance</h3>${rows.length?`<table class="table"><tr><th>Exam</th><th>Subject</th><th>Marks</th><th>Max</th><th>%</th><th>Grade</th></tr>${rows.map(r=>`<tr><td>${esc(r.e.name)}</td><td>${esc(r.e.subject)}</td><td>${r.m}</td><td>${r.e.maxMarks}</td><td>${r.p.toFixed(1)}%</td><td><b>${grade(r.p)}</b></td></tr>`).join('')}<tr class="overall"><th colspan="2">Overall Performance</th><th>${total}</th><th>${max}</th><th>${overall.toFixed(1)}%</th><th>${grade(overall)}</th></tr></table><div class="summary"><div class="stat"><span>Exams</span><b>${rows.length}</b></div><div class="stat"><span>Percentage</span><b>${overall.toFixed(1)}%</b></div><div class="stat"><span>Result</span><b class="${overall>=40?'result-pass':''}">${overall>=40?'PASS':'NEEDS REVIEW'}</b></div><div class="stat"><span>Status</span><b>Recorded</b></div></div><div class="teacher-note"><b>Performance note:</b> ${overall>=90?'Excellent performance. Keep up the good work!':overall>=75?'Very good performance. Continue working consistently.':overall>=60?'Good progress. More regular practice can improve further.':overall>=40?'Satisfactory. Focused practice will help improve results.':'Additional support and practice are recommended.'}</div>`:'<div class="success">No saved marks found for this student. First save marks in Exams & Marks.</div>'}<div class="signatures"><div class="sig">Class Teacher</div><div class="sig">Principal</div></div><div class="foot">Generated from School Management V2 • Keep this report for school records</div>`}
loadClasses();
</script>
</body>
</html>
