<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Report Cards</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f3f6fb;color:#172033}header{background:#003580;color:#fff;padding:18px;text-align:center}.wrap{max-width:1000px;margin:auto;padding:14px}.card,.report{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:180px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#172033;font-size:16px}button{padding:11px 15px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#003580;color:#fff}.green{background:#15803d;color:#fff}.nav{display:inline-block;margin:5px 0 14px;color:#003580;font-weight:bold;text-decoration:none}.muted{color:#64748b}.success{padding:12px;border-radius:9px;background:#f0fdf4;color:#166534}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border:1px solid #cbd5e1;text-align:left}.table th{background:#eaf1ff;color:#003580}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{border:1px solid #dbe3ef;border-radius:8px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:#003580}.studentbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.studentbox,.summary{grid-template-columns:1fr 1fr}.table{font-size:13px}}@media print{header,.no-print{display:none!important}body{background:#fff}.wrap{padding:0}.report{border:2px solid #000}}
</style></head><body><header><h1>📄 Student Report Cards</h1><p>School Management V2</p></header><main class="wrap"><a class="nav no-print" href="school-management-v2.html">← Back to School Management V2</a><div class="card no-print"><h2>Select Student</h2><div class="row"><div class="field"><label>Class</label><select id="cls" onchange="loadSections()"></select></div><div class="field"><label>Section</label><select id="sec" onchange="loadStudents()"></select></div><div class="field"><label>Student</label><select id="stu" onchange="render()"></select></div><button class="primary" onclick="render()">View Report</button><button class="green" onclick="window.print()">🖨 Print / Save PDF</button></div><p id="status" class="muted"></p></div><div id="report" class="report"><p class="muted">Select a student to generate the report card.</p></div></main><script>const KEY='schoolV2Foundation';function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}let db=read();function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalize(){db=read();db.classes=Array.isArray(db.classes)?db.classes:[];db.students=Array.isArray(db.students)?db.students:[];db.exams=Array.isArray(db.exams)?db.exams:[]}function activeClasses(){return db.classes.map((c,i)=>({...c,_i:i})).filter(c=>!c.archived)}function sections(c){return(c?.sections||[]).map((s,j)=>typeof s==='string'?{name:s,archived:false,_j:j}:{...s,_j:j}).filter(s=>!s.archived)}function loadClasses(){normalize();let a=activeClasses();document.getElementById('cls').innerHTML=a.length?a.map(c=>`<option value="${c._i}">${esc(c.name)}</option>`).join(''):'<option value="">No classes found</option>';loadSections()}function loadSections(){normalize();let ci=Number(document.getElementById('cls').value),c=db.classes[ci];document.getElementById('sec').innerHTML=sections(c).map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');loadStudents()}function loadStudents(){normalize();let ci=Number(document.getElementById('cls').value),sec=document.getElementById('sec').value,list=db.students.filter(s=>!s.archived&&Number(s.classIndex)===ci&&String(s.section)===String(sec));document.getElementById('stu').innerHTML=list.length?list.map(s=>`<option value="${esc(String(s.id))}">${esc(s.name)}</option>`).join(''):'<option value="">No students found</option>';document.getElementById('status').textContent=list.length?list.length+' student(s) found.':'No students found for this class/section.';render()}function grade(p){return p==null?'—':p>=90?'A+':p>=80?'A':p>=70?'B+':p>=60?'B':p>=50?'C':p>=40?'D':'F'}function render(){normalize();let id=String(document.getElementById('stu').value||''),s=db.students.find(x=>String(x.id)===id);if(!s){document.getElementById('report').innerHTML='<p class="muted">No student selected.</p>';return}let c=db.classes[Number(s.classIndex)],exs=db.exams.filter(e=>Number(e.classIndex)===Number(s.classIndex)&&String(e.section)===String(s.section)&&e.marks&&Object.keys(e.marks).some(k=>String(k)===id));let rows=exs.map(e=>{let key=Object.keys(e.marks).find(k=>String(k)===id),m=Number(e.marks[key]),p=Number(e.maxMarks)>0?m/Number(e.maxMarks)*100:null;return{e,m,p}});let total=rows.reduce((a,r)=>a+r.m,0),max=rows.reduce((a,r)=>a+Number(r.e.maxMarks||0),0),overall=max?total/max*100:null;document.getElementById('report').innerHTML=`<div class="school"><h2 style="text-align:center;color:#003580">${esc(db.school||'My School')}</h2><p style="text-align:center">Academic Year ${esc(db.year||'2026–27')}</p><h3 style="text-align:center">STUDENT REPORT CARD</h3></div><div class="studentbox"><div><b>Student:</b> ${esc(s.name)}</div><div><b>Class:</b> ${esc(c?.name||'')}</div><div><b>Section:</b> ${esc(s.section)}</div><div><b>Admission No:</b> ${esc(s.admissionNo||'—')}</div></div><h3>Examination Performance</h3>${rows.length?`<table class="table"><tr><th>Exam</th><th>Subject</th><th>Marks</th><th>Max</th><th>%</th><th>Grade</th></tr>${rows.map(r=>`<tr><td>${esc(r.e.name)}</td><td>${esc(r.e.subject)}</td><td>${r.m}</td><td>${r.e.maxMarks}</td><td>${r.p.toFixed(1)}%</td><td><b>${grade(r.p)}</b></td></tr>`).join('')}<tr><th colspan="2">Overall</th><th>${total}</th><th>${max}</th><th>${overall.toFixed(1)}%</th><th>${grade(overall)}</th></tr></table><div class="summary"><div class="stat">Exams<b>${rows.length}</b></div><div class="stat">Percentage<b>${overall.toFixed(1)}%</b></div><div class="stat">Result<b>${overall>=40?'PASS':'NEEDS REVIEW'}</b></div><div class="stat">Status<b>Recorded</b></div></div>`:'<div class="success">No saved marks found for this student. First save marks in Exams & Marks.</div>'}<p style="margin-top:40px"><b>Class Teacher:</b> ____________________ &nbsp;&nbsp; <b>Principal:</b> ____________________</p>`}loadClasses();</script></body></html>
