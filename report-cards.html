<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Management V2 — Report Cards</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f3f6fb;color:#172033}header{background:#003580;color:#fff;padding:18px;text-align:center}header h1{margin:0}.wrap{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:180px}.field label{display:block;font-size:11px;font-weight:bold;color:#475569;margin-bottom:5px}.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033}button{padding:10px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-weight:bold;cursor:pointer}.primary{background:#003580;color:#fff}.green{background:#15803d;color:#fff}.nav{display:inline-block;margin:8px 0 14px;color:#003580;text-decoration:none;font-weight:bold}.report{border:2px solid #003580;border-radius:12px;padding:22px;background:#fff}.school{text-align:center;border-bottom:2px solid #003580;padding-bottom:12px;margin-bottom:15px}.school h2{margin:0;color:#003580}.studentbox{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border:1px solid #cbd5e1;text-align:left}.table th{background:#eaf1ff;color:#003580}.total{font-weight:bold}.good{color:#166534;font-weight:bold}.muted{color:#64748b;font-size:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{border:1px solid #dbe3ef;border-radius:8px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:#003580}@media(max-width:700px){.studentbox,.summary{grid-template-columns:1fr 1fr}.report{padding:14px}.table{font-size:12px}}@media print{body{background:#fff}.no-print,header,.nav{display:none!important}.wrap{padding:0;max-width:none}.card{border:0;padding:0}.report{border:2px solid #000;min-height:90vh}.school h2{color:#000}.table th{color:#000;background:#eee}}</style></head><body><header><h1>📄 Student Report Cards</h1><p>Connected to School Management V2 • Exams & Marks</p></header><main class="wrap"><a class="nav no-print" href="school-management-v2.html">← Back to School Management V2</a><div class="card no-print"><h2>Select Student</h2><div class="row"><div class="field"><label>Class</label><select id="classSelect" onchange="loadSections()"></select></div><div class="field"><label>Section</label><select id="sectionSelect" onchange="loadStudents()"></select></div><div class="field"><label>Student</label><select id="studentSelect" onchange="renderReport()"></select></div><button class="primary" onclick="renderReport()">View Report</button><button class="green" onclick="window.print()">🖨 Print / Save PDF</button></div></div><div id="report" class="report"><p class="muted">Select a student to generate the report card.</p></div></main><script>const KEY='schoolV2Foundation';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{school:'My School',year:'2026–27',classes:[],students:[],exams:[]};db.exams=Array.isArray(db.exams)?db.exams:[];function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function classes(){return(db.classes||[]).map((c,i)=>({...c,_i:i})).filter(c=>!c.archived)}function sections(c){return(c?.sections||[]).map((s,j)=>typeof s==='string'?{name:s,archived:false,_j:j}:{...s,_j:j}).filter(s=>!s.archived)}function loadClasses(){let a=classes();document.getElementById('classSelect').innerHTML=a.map(c=>`<option value="${c._i}">${esc(c.name)}</option>`).join('');loadSections()}function loadSections(){let ci=+document.getElementById('classSelect').value,c=db.classes[ci];document.getElementById('sectionSelect').innerHTML=sections(c).map(s=>`<option>${esc(s.name)}</option>`).join('');loadStudents()}function loadStudents(){let ci=+document.getElementById('classSelect').value,sec=document.getElementById('sectionSelect').value,list=(db.students||[]).filter(s=>!s.archived&&s.classIndex===ci&&s.section===sec);document.getElementById('studentSelect').innerHTML=list.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');renderReport()}function grade(p){return p==null?'—':p>=90?'A+':p>=80?'A':p>=70?'B+':p>=60?'B':p>=50?'C':p>=40?'D':'F'}function renderReport(){let id=document.getElementById('studentSelect').value,s=(db.students||[]).find(x=>String(x.id)===String(id));if(!s){document.getElementById('report').innerHTML='<p class="muted">No student selected.</p>';return}let c=db.classes[s.classIndex],exs=db.exams.filter(e=>e.classIndex===s.classIndex&&e.section===s.section&&e.marks&&Object.prototype.hasOwnProperty.call(e.marks,s.id));let rows=exs.map(e=>{let m=Number(e.marks[s.id]),p=e.maxMarks?m/e.maxMarks*100:null;return{e,m,p}});let total=rows.reduce((a,r)=>a+r.m,0),max=rows.reduce((a,r)=>a+r.e.maxMarks,0),overall=max?total/max*100:null;let subjects=[...new Set(exs.map(e=>e.subject))];document.getElementById('report').innerHTML=`<div class="school"><h2>${esc(db.school||'My School')}</h2><div>Academic Year ${esc(db.year||'')}</div><h3>STUDENT REPORT CARD</h3></div><div class="studentbox"><div><b>Student:</b> ${esc(s.name)}</div><div><b>Class:</b> ${esc(c?.name||'')}</div><div><b>Section:</b> ${esc(s.section)}</div><div><b>Admission No:</b> ${esc(s.admissionNo||'—')}</div></div><h3>Examination Performance</h3>${rows.length?`<table class="table"><tr><th>Exam</th><th>Subject</th><th>Marks</th><th>Max</th><th>%</th><th>Grade</th></tr>${rows.map(r=>`<tr><td>${esc(r.e.name)}</td><td>${esc(r.e.subject)}</td><td>${r.m}</td><td>${r.e.maxMarks}</td><td>${r.p.toFixed(1)}%</td><td><b>${grade(r.p)}</b></td></tr>`).join('')}<tr class="total"><td colspan="2">Overall</td><td>${total}</td><td>${max}</td><td>${overall.toFixed(1)}%</td><td class="good">${grade(overall)}</td></tr></table><div class="summary"><div class="stat"><span>Exams</span><b>${rows.length}</b></div><div class="stat"><span>Subjects</span><b>${subjects.length}</b></div><div class="stat"><span>Percentage</span><b>${overall.toFixed(1)}%</b></div><div class="stat"><span>Result</span><b>${overall>=40?'PASS':'NEEDS REVIEW'}</b></div></div>`:'<p class="muted">No saved marks found for this student yet. Enter and save marks in Exams & Marks first.</p>'}<p style="margin-top:35px"><b>Class Teacher:</b> ____________________ &nbsp;&nbsp; <b>Principal:</b> ____________________</p>`}loadClasses();</script></body></html>
