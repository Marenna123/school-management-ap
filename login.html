<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Management V2 • Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f9;color:#172033;min-height:100vh;display:grid;place-items:center}.box{width:min(440px,92vw);background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:26px;box-shadow:0 10px 30px #0001}.logo{width:68px;height:68px;border-radius:16px;background:#eaf1ff;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}.title{text-align:center;color:#003580;margin:0}.sub{text-align:center;color:#64748b;font-size:13px;margin:7px 0 22px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#475569}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#003580;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.note{margin-top:15px;padding:11px;border-radius:9px;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;font-size:12px;line-height:1.5}.back{display:block;text-align:center;margin-top:15px;color:#003580;font-weight:700;text-decoration:none}</style></head><body><main class="box"><div class="logo">🏫</div><h1 class="title">School Management V2</h1><p class="sub">Secure school access</p><div class="field"><label>School Code</label><input id="schoolCode" placeholder="Enter school code"></div><div class="field"><label>Role</label><select id="role"><option value="admin">Admin</option><option value="teacher">Teacher</option></select></div><div class="field"><label>Email / Username</label><input id="user" autocomplete="username" placeholder="Enter username"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="Enter password"></div><button class="btn" onclick="login()">Login</button><div class="note"><b>Cloud connection:</b> This login screen is ready for the online authentication/database layer. It will not create fake accounts or store passwords in the browser. The next step is connecting the school's Firebase/Supabase backend.</div><a class="back" href="school-management-v2.html">← Back to school setup</a></main><script>function login(){alert('Online authentication is not connected yet. No password has been stored. We will connect the real school database next.')}</script></body></html>
