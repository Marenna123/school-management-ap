<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Management V2 • Secure Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f9;color:#172033;min-height:100vh;display:grid;place-items:center}.box{width:min(460px,92vw);background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:26px;box-shadow:0 10px 30px #0001}.logo{width:68px;height:68px;border-radius:16px;background:#eaf1ff;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}.title{text-align:center;color:#003580;margin:0}.sub{text-align:center;color:#64748b;font-size:13px;margin:7px 0 22px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#475569}.field input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#003580;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:7px}.secondary{background:#15803d}.note{margin-top:15px;padding:11px;border-radius:9px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;font-size:12px;line-height:1.5}.status{margin-top:12px;padding:10px;border-radius:9px;display:none;font-size:12px}.status.show{display:block}.back{display:block;text-align:center;margin-top:15px;color:#003580;font-weight:700;text-decoration:none}</style></head><body><main class="box"><div class="logo">🏫</div><h1 class="title">School Management V2</h1><p class="sub">Secure cloud access</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Your email address"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div><button class="btn" onclick="login()">Login</button><button class="btn secondary" onclick="signup()">Create Admin Account</button><div id="status" class="status"></div><div class="note"><b>Cloud database:</b> Your school records are protected by Supabase authentication and Row Level Security. Passwords are handled by Supabase Auth.</div><a class="back" href="school-cloud.html">← Open cloud school app</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key);const statusEl=document.getElementById('status');function status(msg,ok=false){statusEl.textContent=msg;statusEl.className='status show';statusEl.style.background=ok?'#f0fdf4':'#fff7ed';statusEl.style.color=ok?'#166534':'#7c2d12'}async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||!password)return status('Enter your email and password.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return status(error.message);status('Login successful. Opening cloud school app...',true);setTimeout(()=>location.href='school-cloud.html',500)}async function signup(){const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||password.length<6)return status('Enter an email and a password of at least 6 characters.');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/school-cloud.html'}});if(error)return status(error.message);if(data.session){status('Account created. Opening cloud school app...',true);setTimeout(()=>location.href='school-cloud.html',500)}else status('Account created. Check your email for the confirmation link.',true)}</script></body></html>
