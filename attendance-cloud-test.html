<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Attendance Test</title><style>body{font-family:Arial;background:#f3f6fb;color:#172033;margin:0}.wrap{max-width:900px;margin:25px auto;padding:16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin-bottom:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#003580;color:#fff;font-weight:bold;margin-top:10px}.ok{background:#f0fdf4;color:#166534;padding:10px;border-radius:8px}.err{background:#fff7ed;color:#9a3412;padding:10px;border-radius:8px}.student{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #e2e8f0}.student select{width:130px;padding:7px}</style></head><body><main class="wrap"><div class="card"><h1>📅 Cloud Attendance Test</h1><p>This isolated test does not modify the existing attendance screen.</p><div class="row"><div class="field"><label>Class</label><select id="classSelect"></select></div><div class="field"><label>Date</label><input id="date" type="date"></div></div><button class="btn" id="loadBtn">Load Students</button><div id="status"></div></div><div class="card"><h2>Students</h2><div id="students">Choose a class and date.</div><button class="btn" id="saveBtn" style="display:none">Save Attendance</button><button class="btn" id="reloadBtn" style="display:none">Reload Saved Attendance</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.key);let user,school,students=[];const status=document.getElementById('status');const today=new Date().toISOString().slice(0,10);document.getElementById('date').value=today;const msg=(t,ok=false)=>{status.textContent=t;status.className=ok?'ok':'err'};async function boot(){const a=await sb.auth.getUser();user=a.data.user;if(!user){msg('Please sign in to the school app first.');return}const s=await sb.from('schools').select('id').eq('owner_id',user.id).maybeSingle();if(s.error||!s.data){msg(s.error?.message||'No school found for this account.');return}school=s.data;const c=await sb.from('classes').select('id,name').eq('school_id',school.id).eq('archived',false).order('name');if(c.error){msg(c.error.message);return}document.getElementById('classSelect').innerHTML=(c.data||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');msg('Connected. Select a class and load students.',true)}async function load(){if(!school)return;const cid=document.getElementById('classSelect').value;if(!cid){msg('No class available.');return}const r=await sb.from('students').select('id,name,admission_no').eq('school_id',school.id).eq('class_id',cid).eq('archived',false).order('name');if(r.error){msg(r.error.message);return}students=r.data||[];const d=document.getElementById('date').value;const ar=await sb.from('attendance').select('student_id,status').eq('school_id',school.id).eq('attendance_date',d);if(ar.error){msg(ar.error.message);return}const saved=Object.fromEntries((ar.data||[]).map(x=>[x.student_id,x.status]));document.getElementById('students').innerHTML=students.length?students.map(s=>`<div class="student"><span>${s.name}${s.admission_no?' • '+s.admission_no:''}</span><select data-id="${s.id}"><option value="present" ${(saved[s.id]||'present')==='present'?'selected':''}>Present</option><option value="absent" ${saved[s.id]==='absent'?'selected':''}>Absent</option></select></div>`).join(''):'No students in this class.';document.getElementById('saveBtn').style.display=students.length?'inline-block':'none';document.getElementById('reloadBtn').style.display=students.length?'inline-block':'none';msg(`Loaded ${students.length} student(s).`,true)}async function save(){const d=document.getElementById('date').value;if(!d)return msg('Choose a date.');const rows=[...document.querySelectorAll('#students select')].map(e=>({school_id:school.id,student_id:e.dataset.id,attendance_date:d,status:e.value}));if(!rows.length)return msg('No students to save.');const r=await sb.from('attendance').upsert(rows,{onConflict:'student_id,attendance_date'});if(r.error){msg('Save failed: '+r.error.message);return}msg('Attendance saved successfully to Supabase.',true)}document.getElementById('loadBtn').onclick=load;document.getElementById('reloadBtn').onclick=load;document.getElementById('saveBtn').onclick=save;boot();</script></body></html>
